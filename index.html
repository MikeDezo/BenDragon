    <title>Ben &amp; Dragon!</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const removeDiceBag = () => {
        document.querySelectorAll('[aria-label="Dice Bag"], [title="Dice Bag"]').forEach((element) => {
          const button = element.closest('button') || element;
          const divider = button.previousElementSibling;
          if (divider?.tagName === 'HR') divider.remove();
          button.remove();
        });
      };

      new MutationObserver(removeDiceBag).observe(document.body, { childList: true, subtree: true });
      removeDiceBag();
    </script>
    <script type="module" src="/assets/main-C_IuZtWQ-r2.js"></script>
  </body>
